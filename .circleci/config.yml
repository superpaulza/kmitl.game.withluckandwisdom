version: 2.1

# =============================================================================
# CircleCI Pipeline: With Luck And Wisdom - Multi-Platform Build
# Builds: Windows, macOS, Linux (DesktopGL), Android, iOS
#
# Key design:
#   - Content is built ONCE on Linux (where MGCB works reliably) and
#     shared via workspaces to macOS/iOS/Android jobs which skip content building.
#   - Windows, Linux build their own content on Linux Docker.
#   - macOS artifacts ship as signed .app bundles (Finder-double-clickable),
#     not loose binaries.
# =============================================================================

orbs:
  win: circleci/windows@5.0

executors:
  linux-dotnet:
    docker:
      - image: mcr.microsoft.com/dotnet/sdk:9.0
    resource_class: large
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      # .NET 9 TerminalLogger crashes (MSB4017) on CircleCI's pty; use console logger
      MSBUILDTERMINALLOGGER: "off"

  macos-build:
    macos:
      xcode: "16.4.0"
    resource_class: macos.m1.medium.gen1
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      MONOGAME_SKIP_CONTENT: "true"
      # .NET 9 TerminalLogger crashes (MSB4017) on CircleCI's pty; use console logger
      MSBUILDTERMINALLOGGER: "off"
      DOTNET_ROOT: /Users/distiller/.dotnet
      PATH: /Users/distiller/.dotnet:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

commands:
  checkout_and_restore:
    steps:
      - checkout
      - restore_cache:
          keys:
            - dotnet-v2-{{ checksum "Game.Core/Game.Core.csproj" }}
            - dotnet-v2-

  save_dotnet_cache:
    steps:
      - save_cache:
          key: dotnet-v2-{{ checksum "Game.Core/Game.Core.csproj" }}
          paths:
            - ~/.nuget/packages

  restore_mgcb_tool:
    steps:
      - run:
          name: Restore MGCB content builder tool
          command: dotnet tool restore || true

  install_linux_deps:
    steps:
      - run:
          name: Install native dependencies (Linux)
          command: |
            apt-get update && apt-get install -y \
              libfreetype6 \
              libpng16-16 \
              libgl1-mesa-glx \
              libgl1-mesa-dri \
              ffmpeg \
              zip \
              || true

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Build content on Linux (where MGCB FFmpeg works reliably)
  # ---------------------------------------------------------------------------
  build-content:
    executor: linux-dotnet
    steps:
      - checkout_and_restore
      - install_linux_deps
      - restore_mgcb_tool
      - run:
          name: Build MGCB content
          command: |
            dotnet build Game.Core/Game.Core.csproj \
              -c Release
      - persist_to_workspace:
          root: .
          paths:
            - Game.Core/Content/bin
            - Game.Core/Content/obj

  # ---------------------------------------------------------------------------
  # DesktopGL Build (Windows, Linux)
  # ---------------------------------------------------------------------------
  build-desktop-windows:
    executor:
      name: win/default
      size: large
    steps:
      - checkout
      - run:
          name: Install .NET SDK 9.0
          command: |
            choco install dotnet-sdk --version=9.0.100 -y
      - attach_workspace:
          at: .
      - run:
          name: Restore NuGet packages
          command: $env:MSBUILDTERMINALLOGGER = 'off'; dotnet restore Game.DesktopGL/Game.DesktopGL.csproj
      - run:
          name: Build for Windows
          command: $env:MSBUILDTERMINALLOGGER = 'off'; dotnet publish Game.DesktopGL/Game.DesktopGL.csproj -c Release -r win-x64 --self-contained true -o artifacts/windows
      - run:
          name: Package Windows build
          command: |
            Compress-Archive -Path artifacts/windows\* -DestinationPath artifacts/with-luck-and-wisdom-windows-x64.zip
      - store_artifacts:
          path: artifacts/with-luck-and-wisdom-windows-x64.zip
          destination: builds/windows

  build-desktop-linux:
    executor: linux-dotnet
    steps:
      - checkout_and_restore
      - install_linux_deps
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Restore NuGet packages
          command: dotnet restore Game.DesktopGL/Game.DesktopGL.csproj
      - run:
          name: Build for Linux
          command: dotnet publish Game.DesktopGL/Game.DesktopGL.csproj -c Release -r linux-x64 --self-contained true -o artifacts/linux
      - run:
          name: Package Linux build
          command: |
            cd artifacts/linux && zip -r ../with-luck-and-wisdom-linux-x64.zip . && cd ..
      - save_dotnet_cache
      - store_artifacts:
          path: artifacts/with-luck-and-wisdom-linux-x64.zip
          destination: builds/linux

  # ---------------------------------------------------------------------------
  # macOS Build (Intel + Apple Silicon) - content pre-built on Linux
  # ---------------------------------------------------------------------------
  build-desktop-macos:
    executor: macos-build
    steps:
      - checkout
      - run:
          name: Install .NET SDK 9.0
          command: |
            curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 9.0 --install-dir /Users/distiller/.dotnet
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - run:
          name: Restore NuGet packages
          command: /Users/distiller/.dotnet/dotnet restore Game.DesktopGL/Game.DesktopGL.csproj
      - run:
          name: Build for macOS (Intel)
          command: /Users/distiller/.dotnet/dotnet publish Game.DesktopGL/Game.DesktopGL.csproj -c Release -r osx-x64 --self-contained true -p:BuildContent=false -p:EnableMGCBItems=false -o artifacts/macos-x64
      - run:
          name: Build for macOS (Apple Silicon)
          command: /Users/distiller/.dotnet/dotnet publish Game.DesktopGL/Game.DesktopGL.csproj -c Release -r osx-arm64 --self-contained true -p:BuildContent=false -p:EnableMGCBItems=false -o artifacts/macos-arm64
      - run:
          name: Bundle macOS .app and package artifacts
          command: |
            for arch in x64 arm64; do
              APP="artifacts/with-luck-and-wisdom-macos-$arch.app"
              mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
              cp Game.DesktopGL/Info.plist "$APP/Contents/Info.plist"
              cp -R "artifacts/macos-$arch/." "$APP/Contents/MacOS/"
              chmod +x "$APP/Contents/MacOS/Game.DesktopGL"
              # Ad-hoc sign so the bundle launches on a Mac
              # (first launch: right-click > Open to bypass Gatekeeper for unsigned builds)
              codesign --force --deep --sign - "$APP" || true
              ditto -c -k --keepParent "$APP" "artifacts/with-luck-and-wisdom-macos-$arch.zip"
            done
      - store_artifacts:
          path: artifacts/with-luck-and-wisdom-macos-x64.zip
          destination: builds/macos-x64
      - store_artifacts:
          path: artifacts/with-luck-and-wisdom-macos-arm64.zip
          destination: builds/macos-arm64

  # ---------------------------------------------------------------------------
  # Android Build
  # ---------------------------------------------------------------------------
  build-android:
    executor: linux-dotnet
    steps:
      - checkout
      - run:
          name: Install Java 17 and Android SDK
          command: |
            apt-get update && apt-get install -y openjdk-17-jdk wget unzip
            export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
            export PATH="$JAVA_HOME/bin:$PATH"
            mkdir -p /opt/android-sdk/cmdline-tools
            cd /opt/android-sdk/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            export ANDROID_HOME=/opt/android-sdk
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
            yes | sdkmanager --licenses > /dev/null 2>&1 || true
            sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1
            echo 'export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64' >> "$BASH_ENV"
            echo 'export ANDROID_HOME=/opt/android-sdk' >> "$BASH_ENV"
            echo 'export PATH="$JAVA_HOME/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Android workload
          command: dotnet workload install android --skip-manifest-update
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - dotnet-restore-android-v5-{{ checksum "Game.Android/Game.Android.csproj" }}
            - dotnet-restore-android-v5-
      - run:
          name: Restore NuGet packages
          command: dotnet restore Game.Android/Game.Android.csproj
      - save_cache:
          key: dotnet-restore-android-v5-{{ checksum "Game.Android/Game.Android.csproj" }}
          paths:
            - ~/.nuget/packages
            - ~/.android
      - run:
          name: Build Android APK
          command: |
            dotnet publish Game.Android/Game.Android.csproj \
              -c Release \
              -r android-arm64 \
              -o artifacts/android \
              /p:AndroidPackageType=apk
      - run:
          name: Find and copy APK
          command: |
            find artifacts/android -name "*.apk" -exec cp {} artifacts/with-luck-and-wisdom.apk \;
      - store_artifacts:
          path: artifacts/with-luck-and-wisdom.apk
          destination: builds/android

  # ---------------------------------------------------------------------------
  # iOS Build (unsigned) - content pre-built on Linux
  # ---------------------------------------------------------------------------
  build-ios:
    executor: macos-build
    steps:
      - checkout
      - run:
          name: Install .NET SDK 9.0 and iOS workload
          command: |
            curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 9.0 --install-dir /Users/distiller/.dotnet
            /Users/distiller/.dotnet/dotnet workload install ios --skip-manifest-update
      - restore_mgcb_tool
      - attach_workspace:
          at: .
      - restore_cache:
          keys:
            - dotnet-restore-ios-v5-{{ checksum "Game.iOS/Game.iOS.csproj" }}
            - dotnet-restore-ios-v5-
      - run:
          name: Restore NuGet packages
          command: /Users/distiller/.dotnet/dotnet restore Game.iOS/Game.iOS.csproj
      - save_cache:
          key: dotnet-restore-ios-v5-{{ checksum "Game.iOS/Game.iOS.csproj" }}
          paths:
            - ~/.nuget/packages
      - run:
          name: Build iOS (unsigned)
          command: |
            /Users/distiller/.dotnet/dotnet publish Game.iOS/Game.iOS.csproj \
              -c Release \
              -r ios-arm64 \
              -o artifacts/ios \
              -p:BuildContent=false \
              -p:EnableMGCBItems=false \
              /p:BuildIpa=true \
              /p:CodesignKey="-" \
              /p:CodesignProvision="-"
      - run:
          name: Find and copy IPA
          command: |
            find artifacts/ios -name "*.ipa" -exec cp {} artifacts/with-luck-and-wisdom-unsigned.ipa \;
      - store_artifacts:
          path: artifacts/with-luck-and-wisdom-unsigned.ipa
          destination: builds/ios

# =============================================================================
# Workflows
# =============================================================================
workflows:
  build-all-platforms:
    jobs:
      - build-content
      - build-desktop-linux:
          requires:
            - build-content
      - build-desktop-macos:
          requires:
            - build-content
      - build-desktop-windows:
          requires:
            - build-content
      - build-android:
          requires:
            - build-content
      - build-ios:
          requires:
            - build-content

  # Trigger on tags for release builds
  release-build:
    jobs:
      - build-content:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-desktop-linux:
          requires:
            - build-content
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-desktop-macos:
          requires:
            - build-content
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-desktop-windows:
          requires:
            - build-content
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-android:
          requires:
            - build-content
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
      - build-ios:
          requires:
            - build-content
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
